# Seed schedule: 5/3/2/2 across the four shot tiers -- the deterministic
# support set (seed: null) plus reruns 0-3 / 0-1 / 0 / 0. Twelve runs.
grid: DistillDCAMASwinISIC
parameters:
  device: ['cuda:0']
  log_model: [false]
  dataloader:
    num_workers: [0]
  dataset:
    datasets:
      test_isic:
        datapath: [data]
        prompt_images: [9]
        seed: [null, 0, 1, 2, 3]
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      image_size: [384]
  model:
    name: [distillator]
    params:
      teacher:
        name: [dcama]
        backbone: [swin]
        backbone_checkpoint: [checkpoints/swin_base_patch4_window12_384.pth]
        model_checkpoint: [checkpoints/swin_fold0_pascal_modcross_soft.pt]
        concat_support: [false]
        image_size: [384]
      student:
        name: [conv_distillator]
        num_classes: [3]
  refinement:
    lr: [0.001]
    max_iterations: [1000]
    hot_parameters:
    - [model.conv1, model.conv2, model.conv3, model.conv4, model.conv5, model.mixer1, model.mixer2, model.mixer3,
      student]
    subsample: [3]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      name: [refine_distill]
  test:
    prompt_to_use: [null]
  tracker:
    project: [FSSWeed]
    group: [ISIC]
    log_frequency: [1]
    tags:
    - [ISIC]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
other_grids:
- dataset:
    datasets:
      test_isic:
        prompt_images: [15]
        seed: [null, 0, 1]
- dataset:
    datasets:
      test_isic:
        prompt_images: [30, 60]
        seed: [null, 0]
