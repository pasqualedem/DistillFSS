grid: DistillDMTNetIndustrial
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [0]
  dataset:
    preprocess:
      mean: [[0.485, 0.456, 0.406]]
      std: [[0.229, 0.224, 0.225]]
      image_size: [384]
    datasets:
      test_industrial:
        datapath: [data]
        fold: [0]                       # fold 0 = 5 fg defect classes (bg+5 = 6)
        prompt_images: [10, 20, 40, 80]  # 2/4/8/16 per class
  tracker:
    project: [FSSWeed]
    group: [Industrial]
    log_frequency: [1]
    tags: [[Industrial, Distill]]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
  model:
    name: [distillator]
    params:
      teacher:
          name: [dmtnet]
          backbone: [resnet50]
          model_checkpoint: [checkpoints/dmtnet.pt]
          voting: [false]
      student:
        name: [dmtnet_distillator]
        num_classes: [5]        # 5 fg defect classes
        num_conv_layers: [4]
        logit_mode: [logits]    # multi-class -> raw logits, avoids double-softmax collapse
  refinement:
    # Same stabilised low-shot recipe as KVASIR/ISIC (augment + low lr + strong wd
    # + grad clip). Industrial is fg-sparse multi-class -> keep the [1,8x5] class
    # weights (from the INSID3 recipe) to stop the all-background collapse.
    lr: [5.e-4]
    max_iterations: [500]
    augment: [true]
    weight_decay: [5.e-3]
    grad_clip: [1.0]
    hot_parameters:
      -
        - "hpn_learner.decoder1"
        - "hpn_learner.decoder2"
        - "hpn_learner.encoder_layer4"
        - "hpn_learner.encoder_layer3"
        - "hpn_learner.encoder_layer2"
        - "student"
    subsample: [3]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      # Multi-class fix (see dmtnet-multiclass-kd memory): logit distillation
      # (delta) + strong feature distillation + class weights, ported from the
      # ISIC 9-shot sweep winner (2.86 -> 11.11). Weights scaled to bg+5fg.
      - name: refine_distill
        alpha: 1.0
        beta: 1.0
        gamma: 2.0
        delta: 2.0
        weights: [1.0, 3.0, 3.0, 3.0, 3.0, 3.0]

# Seed schedule (the default): 5/3/2/2 seeds across the four shot tiers --
# the deterministic support set (null) plus reruns 0-3 / 0-1 / 0 / 0.
# start_from_grid skips the base grid above, which only carries the recipe.
start_from_grid: 1
other_grids:
  - dataset:
      datasets:
        test_industrial: {prompt_images: [10], seed: [null, 0, 1, 2, 3]}
  - dataset:
      datasets:
        test_industrial: {prompt_images: [20], seed: [null, 0, 1]}
  - dataset:
      datasets:
        test_industrial: {prompt_images: [40, 80], seed: [null, 0]}
