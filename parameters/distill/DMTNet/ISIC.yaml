grid: DistillDMTNetISIC
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [0]
  dataset:
    preprocess:
      mean: [[0.485, 0.456, 0.406]]
      std: [[0.229, 0.224, 0.225]]
      image_size: [400]
    datasets:
      test_isic:
        datapath: [data]
        prompt_images:
          - 9
          - 15
          - 30
          - 60
  tracker:
    project: [FSSWeed]
    group: [ISIC]
    log_frequency: [1]
    tags: [[ISIC, Distill]]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [25]
    test_image_log_frequency: [10]
  model:
    name: [distillator]
    params:
      teacher:
          name: [dmtnet]
          backbone: [resnet50]
          model_checkpoint: [checkpoints/dmtnet.pt]
          voting: [false]
      student:
        name: [dmtnet_distillator]
        num_classes: [3]        # nevus, melanoma, seborrheic_keratosis
        num_conv_layers: [4]
        logit_mode: [logits]    # 3-class -> raw logits, avoids double-softmax collapse
  refinement:
    lr: [1.e-3]
    max_iterations: [1000]
    hot_parameters:
      -
        - "hpn_learner.decoder1"
        - "hpn_learner.decoder2"
        - "hpn_learner.encoder_layer4"
        - "hpn_learner.encoder_layer3"
        - "hpn_learner.encoder_layer2"
        - "student"
    subsample: [3]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      - name: refine_distill
        alpha: 1.5
        beta: 1.5
        gamma: 0.5
