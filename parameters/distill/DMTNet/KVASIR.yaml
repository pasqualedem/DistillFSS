grid: DistillDMTNetKVASIR
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [0]
  dataset:
    preprocess:
      mean: [[0.485, 0.456, 0.406]]
      std: [[0.229, 0.224, 0.225]]
      image_size: [400]
    datasets:
      test_kvasir:
        datapath: [data]
        prompt_images:
          - 5
          - 10
          - 25
          - 50
  tracker:
    project: [FSSWeed]
    group: [KVASIR]
    log_frequency: [1]
    tags: [[KVASIR, Distill]]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
  model:
    name: [distillator]
    params:
      teacher:
          name: [dmtnet]
          backbone: [resnet50]
          model_checkpoint: [checkpoints/dmtnet.pt]
          voting: [false]
      student:
        name: [dmtnet_distillator]
        num_classes: [1]        # binary polyp
        num_conv_layers: [4]
        logit_mode: [double_softmax]   # binary -> safe, no collapse
  refinement:
    # Low-shot recipe (tuned on 5-shot, see dmtnet-lowshot-augment memory):
    # augmentation + low lr + strong weight decay + gradient clipping to prevent
    # the all-background collapse. Lifts 5-shot from 26.3 -> ~45-47 (teacher parity).
    lr: [5.e-4]
    max_iterations: [500]
    augment: [true]
    weight_decay: [5.e-3]
    grad_clip: [1.0]
    hot_parameters:
      -
        - "hpn_learner.decoder1"
        - "hpn_learner.decoder2"
        - "hpn_learner.encoder_layer4"
        - "hpn_learner.encoder_layer3"
        - "hpn_learner.encoder_layer2"
        - "student"
    subsample: [1]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      - name: refine_distill
        alpha: 1.5
        beta: 1.5
        gamma: 0.5

# Seed schedule (the default): 5/3/2/2 seeds across the four shot tiers --
# the deterministic support set (null) plus reruns 0-3 / 0-1 / 0 / 0.
# start_from_grid skips the base grid above, which only carries the recipe.
start_from_grid: 1
other_grids:
  - dataset:
      datasets:
        test_kvasir: {prompt_images: [5], seed: [null, 0, 1, 2, 3]}
  - dataset:
      datasets:
        test_kvasir: {prompt_images: [10], seed: [null, 0, 1]}
  - dataset:
      datasets:
        test_kvasir: {prompt_images: [25, 50], seed: [null, 0]}
