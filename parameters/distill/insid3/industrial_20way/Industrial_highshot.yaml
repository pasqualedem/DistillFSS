grid: DistillINSID3IndustrialHighshot
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [4]
  dataset:
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      # 160/320-shot OOM at 512 (support-scaled activations hit ~20GB by step ~90).
      # 384 fits 320-shot in 24GB. NOTE: 40/80-shot were run at 512; if you want a
      # fully consistent resolution trend, rerun all 4 (see the "all 4" command).
      image_size: [384]
    datasets:
      test_industrial:
        datapath: [data]
        # fold=null 20-way; heavy shots only (2/4 already done at 512: 6.99 / 13.90).
        fold: [null]
        prompt_images: [160, 320]
  tracker:
    project: [FSSWeed]
    group: [Industrial]
    log_frequency: [1]
    tags:
    - [Industrial, Distill]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
    # mode: [offline]
  model:
    name: [distillator]
    params:
      teacher:
        name: [insid3]
        differentiable: [true]
        adapter: [conv]
      student:
        name: [insid3_distillator]
        num_classes: [20]
        coarse: [false]
        # logits (NOT double_softmax): fixes the 20-way winner-take-all collapse.
        logit_mode: [logits]
  refinement:
    lr: [0.001]
    max_iterations: [100]  # match 40/80-shot budget; val plateaus by step 50
    hot_parameters:
      - [student, adapter]
    subsample: [3]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      name: [refine_distill]
    validate_every: [50]
