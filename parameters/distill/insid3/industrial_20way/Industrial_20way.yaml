# 20-WAY EXPERIMENT (archived, superseded by standard fold-0 Industrial.yaml).
# Design: fold=null trains the student on ALL 20 defect classes in one run/shot,
# then at test discards the non-query-fold logits (DatasetIndustrial.restrict_logits_to_fold,
# called in distillfss/test.py before argmax) since each query's fold is known.
# KEY FINDING: 20-way needs logit_mode=logits, NOT double_softmax (double_softmax
# winner-take-all collapses all but one class -> flat fg 3.3; logits un-collapses).
# Results (fold-restricted fg Jaccard): 40->6.99 / 80->13.90 / 160->17.27 @512;
# 320-shot OOMs even at 384. See industrial_20way/README.md.
grid: DistillINSID3Industrial20way
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [4]
  dataset:
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      image_size: [512]  # 20-way OOMs/crawls at 1024; 512 fits up to 160-shot (320 OOMs)
    datasets:
      test_industrial:
        datapath: [data]
        # fold=null: train on ALL 20 classes; restrict_logits_to_fold at test.
        # prompt_images = per-fold [10,20,40,80] x4 for 20 classes -> [40,80,160,320]
        # = 2/4/8/16 per class (paired substitutor needs >=2/class).
        fold: [null]
        prompt_images: [40, 80, 160, 320]
  tracker:
    project: [FSSWeed]
    group: [Industrial]
    log_frequency: [1]
    tags:
    - [Industrial, Distill, 20way, archived]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
    # mode: [offline]
  model:
    name: [distillator]
    params:
      teacher:
        name: [insid3]
        differentiable: [true]
        adapter: [conv]
      student:
        name: [insid3_distillator]
        num_classes: [20]
        coarse: [false]
        # logits (bg=0, raw fg logits, single softmax in loss) = WeedMap multi-class
        # fix. double_softmax winner-take-all collapses the 20-way student to fg 3.3.
        logit_mode: [logits]
  refinement:
    lr: [0.001]
    max_iterations: [100]  # val Jaccard plateaus by step 50 (best-val ckpt used at test)
    hot_parameters:
      - [student, adapter]
    subsample: [3]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      name: [refine_distill]
    validate_every: [50]
