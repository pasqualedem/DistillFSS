grid: DistillINSID3Pothole
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [0]
  dataset:
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      image_size: [1024]
    datasets:
      test_pothole:
        datapath: [data]
        prompt_images: [5, 10, 25, 50]
  tracker:
    project: [FSSWeed]
    group: [Pothole]
    log_frequency: [1]
    tags:
    - [Pothole, Distill]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
    # mode: [offline]
  model:
    name: [distillator]
    params:
      teacher:
        name: [insid3]
        differentiable: [true]
        adapter: [conv]
      student:
        name: [insid3_distillator]
        num_classes: [1]
        # Broken with old recipe (0.0 @5-shot, 15 @10-shot): foreground-sparse
        # recall collapse. Real logits + fg weighting (cf. WeedMap fix). Coarse off
        # (teacher is weak, ~6 fg).
        coarse: [false]
        logit_mode: [logits]
  refinement:
    lr: [0.001]
    max_iterations: [500]
    hot_parameters:
      - [student, adapter]
    subsample: [1]
    substitutor: [null]
    loss:
      name: [refine_distill]
      weights: [[1.0, 8.0]]
    validate_every: [50]
    iterations_is_num_classes: [false]

# Seed schedule (the default): 5/3/2/2 seeds across the four shot tiers --
# the deterministic support set (null) plus reruns 0-3 / 0-1 / 0 / 0.
# start_from_grid skips the base grid above, which only carries the recipe.
start_from_grid: 1
other_grids:
  - dataset:
      datasets:
        test_pothole: {prompt_images: [5], seed: [null, 0, 1, 2, 3]}
  - dataset:
      datasets:
        test_pothole: {prompt_images: [10], seed: [null, 0, 1]}
  - dataset:
      datasets:
        test_pothole: {prompt_images: [25, 50], seed: [null, 0]}
