grid: DistillINSID3KVASIR
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [4]
  dataset:
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      image_size: [1024]
    datasets:
      test_kvasir:
        datapath: [data]
        prompt_images: [5, 10, 25, 50]
  tracker:
    project: [FSSWeed]
    group: [KVASIR]
    log_frequency: [1]
    tags:
    - [KVASIR, Distill]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
    # mode: [offline]
  model:
    name: [distillator]
    params:
      teacher:
        name: [insid3]
        differentiable: [true]
        adapter: [conv]
      student:
        name: [insid3_distillator]
        num_classes: [1]
        # Reproduce-old (double_softmax, no weights) was RECALL-LIMITED at low shots
        # (5-shot polyp recall 0.59, precision 0.96 -> fg 57.6 vs old ~74). Deterministic
        # prompts, so it's real recall collapse, not variance. Fix like Pothole: real
        # logits + fg weighting (precision has headroom to trade for recall).
        coarse: [false]
        logit_mode: [logits]
  refinement:
    lr: [0.001]
    max_iterations: [500]
    hot_parameters:
      - [student, adapter]
    subsample: [1]
    substitutor: [null]
    loss:
      name: [refine_distill]
      weights: [[1.0, 6.0]]
    validate_every: [50]
    iterations_is_num_classes: [false]
