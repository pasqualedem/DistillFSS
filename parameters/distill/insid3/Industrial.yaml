grid: DistillINSID3Industrial
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [4]
  dataset:
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      image_size: [512]  # 5-class fold-0 fits easily at 512 (no OOM)
    datasets:
      test_industrial:
        datapath: [data]
        # ROLLED BACK to standard single-fold FSS (fold 0 = 5 classes). The 20-way
        # (fold=null) + restrict_logits_to_fold design worked but 320-shot OOM'd even
        # at 384 and 384<512 in quality -- too fiddly. fold 0 is light and clean.
        # prompt_images = original per-fold [10,20,40,80] = 2/4/8/16 per class.
        fold: [0]
        prompt_images: [10, 20, 40, 80]
  tracker:
    project: [FSSWeed]
    group: [Industrial]
    log_frequency: [1]
    tags:
    - [Industrial, Distill]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
    # mode: [offline]
  model:
    name: [distillator]
    params:
      teacher:
        name: [insid3]
        differentiable: [true]
        adapter: [conv]
      student:
        name: [insid3_distillator]
        num_classes: [5]  # fold 0 = 5 fg classes (student builds 5 heads; output = bg+5 = 6 = dataset.num_classes)
        coarse: [false]
        # logits (bg=0, raw fg logits, single softmax in loss). coarse+logits earlier
        # collapsed 4/5 to only wood (fg 5.0), so coarse stays FALSE.
        logit_mode: [logits]
  refinement:
    lr: [0.001]
    max_iterations: [100]  # reap window as short as ~12min; val Jaccard plateaus by step 50 (best-val ckpt used at test), so 100 completes in-window (~6min) with no quality loss vs 300/500
    hot_parameters:
      - [student, adapter]
    subsample: [3]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      name: [refine_distill]
      # fg-sparse: without weights the student collapsed to all-background (80-shot
      # fg=0.0). Upweight all 5 fg defect classes (bg + 5 fg = 6), Pothole strength 8.
      weights: [[1.0, 8.0, 8.0, 8.0, 8.0, 8.0]]
    validate_every: [50]
