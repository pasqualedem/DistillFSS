grid: DistillINSID3Nucleus
parameters:
  test:
    prompt_to_use: [null] # How many prompt use in testing - null => all
  dataloader:
    num_workers: [0]
  dataset:
    preprocess:
      mean: [[0.485, 0.456, 0.406]]
      std: [[0.229, 0.224, 0.225]]
      image_size: &image_size [1024]
    datasets:
      test_nucleus:
        datapath: [data]
        prompt_images: 
          - 5
          - 10
          - 25
          - 50
  tracker:
    project: [FSSWeed]
    group: [Nucleus]
    log_frequency: [1]
    tags: [[Nucleus, Distill]]
    tmp_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
    # mode: [offline]
  model:
    name: [distillator]
    params:
      teacher:
        name: [insid3]
        differentiable: [true]
        adapter: [conv]
      student:
        name: [insid3_distillator]
        num_classes: [2]
        # Binary localization: old recipe (double_softmax + coarse off) already
        # gave 71-73 fg (>> teacher ~51). Reproduce it; coarse-on risks ISIC-style
        # regression, no multi-class collapse to fix here.
        coarse: [false]
        logit_mode: [double_softmax]
  refinement:
    lr: [1.e-3]
    max_iterations: [500]
    hot_parameters:
      - [student, adapter]
    subsample: [1]
    substitutor: [null]
    iterations_is_num_classes: [false]
    loss:
      name: [refine_distill]

  
# Seed schedule (the default): 5/3/2/2 seeds across the four shot tiers --
# the deterministic support set (null) plus reruns 0-3 / 0-1 / 0 / 0.
# start_from_grid skips the base grid above, which only carries the recipe.
start_from_grid: 1
other_grids:
  - dataset:
      datasets:
        test_nucleus: {prompt_images: [5], seed: [null, 0, 1, 2, 3]}
  - dataset:
      datasets:
        test_nucleus: {prompt_images: [10], seed: [null, 0, 1]}
  - dataset:
      datasets:
        test_nucleus: {prompt_images: [25, 50], seed: [null, 0]}
