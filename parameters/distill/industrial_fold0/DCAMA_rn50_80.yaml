# DistillFSS-DCAMA resnet50 80-shot, Industrial fold 0 -- the ONE distill run
# that OOMs on 24GB (fragmentation after the swin run). Leonardo/big GPU only.
grid: DistillDCAMArn50_80
parameters:
  test:
    prompt_to_use:
    - null
  dataloader:
    num_workers:
    - 0
  dataset:
    preprocess:
      mean:
      - - 0.485
        - 0.456
        - 0.406
      std:
      - - 0.229
        - 0.224
        - 0.225
      image_size:
      - 384
    datasets:
      test_industrial:
        datapath:
        - data
        fold:
        - 0
        prompt_images:
        - 80
  tracker:
    project:
    - FSSWeed
    group:
    - Industrial
    log_frequency:
    - 1
    tags:
    - - Industrial
    tmp_dir:
    - tmp
    cache_dir:
    - tmp
    train_image_log_frequency:
    - 25
    test_image_log_frequency:
    - 10
  model:
    name:
    - distillator
    params:
      teacher:
      - name: dcama
        backbone: resnet50
        backbone_checkpoint: checkpoints/resnet50_a1h-35c100f8.pth
        model_checkpoint: checkpoints/resnet50_fold0_pascal_modcross_soft.pt
        concat_support: false
        image_size: 384
      student:
        name:
        - conv_distillator
        num_classes:
        - 5
  refinement:
    lr:
    - 0.001
    max_iterations:
    - 1000
    hot_parameters:
    - - model.DCAMA_blocks
      - model.conv1
      - model.conv2
      - model.conv3
      - model.conv4
      - model.conv5
      - model.mixer1
      - model.mixer2
      - model.mixer3
      - student
    subsample:
    - 3
    substitutor:
    - paired
    iterations_is_num_classes:
    - false
    loss:
      name:
      - refine_distill
