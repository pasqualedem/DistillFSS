grid: DistillPAHNetISIC
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [0]
  dataset:
    preprocess:
      mean: [[0.485, 0.456, 0.406]]
      std: [[0.229, 0.224, 0.225]]
      image_size: [473] # PAHNet native size
    datasets:
      test_isic:
        datapath: [data]
        prompt_images: [9, 15, 30, 60]
  tracker:
    project: [FSSWeed]
    group: [ISIC]
    log_frequency: [1]
    tags: [[ISIC, Distill, PAHNet]]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
  model:
    name: [distillator]
    params:
      teacher:
        name: [pahnet]
        dataset: [coco]
        shots: [5]
        val_fold_idx: [0]
      student:
        name: [pahnet_distillator]
        num_classes: [3]
  refinement:
    lr: [1.e-3]
    max_iterations: [2500]
    hot_parameters:
      -
        - "student"
        - "teacher.init_merge_query"
        - "teacher.ASPP_meta"
        - "teacher.res1_meta"
        - "teacher.res2_meta"
        - "teacher.cls_meta"
        - "teacher.base_learner"
        - "teacher.gram_merge"
        - "teacher.cls_merge"
    subsample: [3]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      name: [refine_distill]

# Seed schedule (the default): 5/3/2/2 seeds across the four shot tiers --
# the deterministic support set (null) plus reruns 0-3 / 0-1 / 0 / 0.
# start_from_grid skips the base grid above, which only carries the recipe.
start_from_grid: 1
other_grids:
  - dataset:
      datasets:
        test_isic: {prompt_images: [9], seed: [null, 0, 1, 2, 3]}
  - dataset:
      datasets:
        test_isic: {prompt_images: [15], seed: [null, 0, 1]}
  - dataset:
      datasets:
        test_isic: {prompt_images: [30, 60], seed: [null, 0]}
