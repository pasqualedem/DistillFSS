# Seed schedule: 5/3/2/2 across the four shot tiers -- the deterministic
# support set (seed: null) plus reruns 0-3 / 0-1 / 0 / 0. Twelve runs.
grid: BaselineSegICKVASIR
parameters:
  device: ['cuda:0']
  dataloader:
    num_workers: [0]
  dataset:
    datasets:
      test_kvasir:
        datapath: [data]
        prompt_images: [5]
        seed: [null, 0, 1, 2, 3]
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      image_size: [896]
  model:
    name: [segic]
    encoder_model: [dinov2]
    dinov2_model: [l]
    model_checkpoint: [checkpoints/segic/segic_dinov2_l_80kx12e.pth]
    use_cross_inst_prompt: [true]
  test:
    prompt_to_use: [null]
  tracker:
    project: [FSSWeed]
    group: [KVASIR]
    log_frequency: [1]
    tags:
    - [KVASIR, Baselines]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
other_grids:
- dataset:
    datasets:
      test_kvasir:
        prompt_images: [10]
        seed: [null, 0, 1]
- dataset:
    datasets:
      test_kvasir:
        prompt_images: [25, 50]
        seed: [null, 0]
