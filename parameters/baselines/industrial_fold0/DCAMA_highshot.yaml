# DCAMA 40/80-shot, Industrial fold 0 — the ONLY genuinely-OOM baseline runs.
# On the 24GB dev GPU, DCAMA voting=10 at 40/80-shot needs >21.6GB and OOMs.
# 10/20-shot ran locally (swin 0.41/0.45, resnet50 2.04/1.71). Run this on
# Leonardo with --parallel (each run = its own SLURM job / big GPU).
grid: DCAMAIndustrialHighshot
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [0]
  dataset:
    preprocess:
      mean: [[0.485, 0.456, 0.406]]
      std: [[0.229, 0.224, 0.225]]
      image_size: [384]
    datasets:
      test_industrial:
        datapath: [data]
        fold: [0]
        prompt_images: [40, 80]
  tracker:
    project: [FSSWeed]
    group: [Industrial]
    log_frequency: [1]
    tags: [[Industrial, Baselines]]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [25]
    test_image_log_frequency: [10]
  model:
    -
      name: dcama
      backbone: swin
      backbone_checkpoint: checkpoints/swin_base_patch4_window12_384.pth
      model_checkpoint: checkpoints/swin_fold0_pascal_modcross_soft.pt
      concat_support: false
      image_size: 384
      voting: 10
    -
      name: dcama
      backbone: resnet50
      backbone_checkpoint: checkpoints/resnet50_a1h-35c100f8.pth
      model_checkpoint: checkpoints/resnet50_fold0_pascal_modcross_soft.pt
      concat_support: false
      image_size: 384
      voting: 10
