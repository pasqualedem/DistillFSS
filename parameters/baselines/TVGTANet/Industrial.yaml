# Seed schedule: 5/3/2/2 across the four shot tiers -- the deterministic
# support set (seed: null) plus reruns 0-3 / 0-1 / 0 / 0. Twelve runs.
grid: BaselineTVGTANetIndustrial
parameters:
  device: ['cuda:0']
  dataloader:
    num_workers: [0]
  dataset:
    datasets:
      test_industrial:
        datapath: [data]
        fold: [0]
        prompt_images: [10]
        seed: [null, 0, 1, 2, 3]
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      image_size: [400]
  model:
    name: [tvgtanet]
  test:
    prompt_to_use: [null]
  tracker:
    project: [FSSWeed]
    group: [Industrial]
    log_frequency: [1]
    tags:
    - [Industrial, Baselines]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
other_grids:
- dataset:
    datasets:
      test_industrial:
        prompt_images: [20]
        seed: [null, 0, 1]
- dataset:
    datasets:
      test_industrial:
        prompt_images: [40, 80]
        seed: [null, 0]
