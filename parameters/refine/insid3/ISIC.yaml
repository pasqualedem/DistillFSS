grid: RefineINSID3ISIC
parameters:
  test:
    prompt_to_use: [null]
  dataloader:
    num_workers: [0]
  dataset:
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      image_size: [1024]
    datasets:
      test_isic:
        datapath: [data]
        prompt_images: [9, 15, 30, 60]
  tracker:
    project: [FSSWeed]
    group: [ISIC]
    log_frequency: [1]
    tags:
    - [ISIC, Refine, INSID3]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
    mode: [offline]
  model:
  - {name: insid3, differentiable: true, adapter: conv}
  refinement:
    lr: [0.001]
    max_iterations: [1000]
    hot_parameters:
    - [adapter]
    subsample: [3]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      name: [focal]
      gamma: [2]

# Seed schedule (the default): 5/3/2/2 seeds across the four shot tiers --
# the deterministic support set (null) plus reruns 0-3 / 0-1 / 0 / 0.
# start_from_grid skips the base grid above, which only carries the recipe.
start_from_grid: 1
other_grids:
  - dataset:
      datasets:
        test_isic: {prompt_images: [9], seed: [null, 0, 1, 2, 3]}
  - dataset:
      datasets:
        test_isic: {prompt_images: [15], seed: [null, 0, 1]}
  - dataset:
      datasets:
        test_isic: {prompt_images: [30, 60], seed: [null, 0]}
