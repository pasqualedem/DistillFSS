# Seed schedule: 5/3/2/2 across the four shot tiers -- the deterministic
# support set (seed: null) plus reruns 0-3 / 0-1 / 0 / 0. Twelve runs.
grid: RefineDMTNetISIC
parameters:
  device: ['cuda:0']
  log_model: [false]
  dataloader:
    num_workers: [0]
  dataset:
    datasets:
      test_isic:
        datapath: [data]
        prompt_images: [9]
        seed: [null, 0, 1, 2, 3]
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      image_size: [400]
  model:
    name: [dmtnet]
    backbone: [resnet50]
    model_checkpoint: [checkpoints/dmtnet.pt]
    voting: [false]
  refinement:
    lr: [0.0005]
    max_iterations: [500]
    augment: [true]
    stitch: [true]
    stitch_prob: [0.5]
    weight_decay: [0.005]
    grad_clip: [1.0]
    hot_parameters:
    - [hpn_learner.decoder1, hpn_learner.decoder2, hpn_learner.encoder_layer4, hpn_learner.encoder_layer3,
      hpn_learner.encoder_layer2]
    subsample: [3]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      name: [focal]
      gamma: [2]
  test:
    prompt_to_use: [null]
  tracker:
    project: [FSSWeed]
    group: [ISIC]
    log_frequency: [1]
    tags:
    - [ISIC, Distill]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
other_grids:
- dataset:
    datasets:
      test_isic:
        prompt_images: [15]
        seed: [null, 0, 1]
- dataset:
    datasets:
      test_isic:
        prompt_images: [30, 60]
        seed: [null, 0]
