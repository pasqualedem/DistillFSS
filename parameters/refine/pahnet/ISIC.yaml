# Seed schedule: 5/3/2/2 across the four shot tiers -- the deterministic
# support set (seed: null) plus reruns 0-3 / 0-1 / 0 / 0. Twelve runs.
grid: RefinePAHNetISIC
parameters:
  device: ['cuda:0']
  log_model: [false]
  dataloader:
    num_workers: [0]
  dataset:
    datasets:
      test_isic:
        datapath: [data]
        prompt_images: [9]
        seed: [null, 0, 1, 2, 3]
    preprocess:
      mean:
      - [0.485, 0.456, 0.406]
      std:
      - [0.229, 0.224, 0.225]
      image_size: [473]
  model:
    name: [pahnet]
    dataset: [coco]
    shots: [5]
    val_fold_idx: [0]
  refinement:
    lr: [0.001]
    max_iterations: [2500]
    hot_parameters:
    - [init_merge_query, ASPP_meta, res1_meta, res2_meta, cls_meta, base_learner, gram_merge, cls_merge]
    subsample: [3]
    substitutor: [paired]
    iterations_is_num_classes: [false]
    loss:
      name: [focal]
      gamma: [2]
    freeze_bn: [true]
    eval_mode: [true]
  test:
    prompt_to_use: [null]
  tracker:
    project: [FSSWeed]
    group: [ISIC]
    log_frequency: [1]
    tags:
    - [ISIC, Distill, PAHNet]
    tmp_dir: [tmp]
    cache_dir: [tmp]
    train_image_log_frequency: [null]
    test_image_log_frequency: [null]
other_grids:
- dataset:
    datasets:
      test_isic:
        prompt_images: [15]
        seed: [null, 0, 1]
- dataset:
    datasets:
      test_isic:
        prompt_images: [30, 60]
        seed: [null, 0]
